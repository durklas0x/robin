name: Robin
options:
  bundleIdPrefix: com.durklas0x
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.2.1"
    CURRENT_PROJECT_VERSION: "4"

targets:
  Robin:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes: [AppIcon.icon]
      - path: Sources/AppIcon.icon
        type: file
        buildPhase: resources
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.durklas0x.Robin
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_STANDALONE_ICON_BEHAVIOR: all
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Robin reads your current Finder folder and opens Terminal there."
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: RobinFinder
        embed: true
    info:
      path: Config/Robin-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NSAppleEventsUsageDescription: "Robin reads Finder window locations and opens Terminal in your folder."
        CFBundleURLTypes:
          - CFBundleURLName: com.durklas0x.Robin.actions
            CFBundleURLSchemes: [robin]
    entitlements:
      path: Sources/Robin.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true

  RobinFinder:
    type: app-extension
    platform: macOS
    sources:
      - FinderExtension
      - Shared
      - path: Sources/AppIcon.icon
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.durklas0x.Robin.Finder
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
    info:
      path: Config/Finder-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Robin Finder Actions
        NSExtension:
          NSExtensionAttributes: {}
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FinderSync
    entitlements:
      path: Config/RobinFinder.entitlements
      properties:
        com.apple.security.app-sandbox: true

  RobinTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Shared
      - Sources/BarPlacement.swift
      - Sources/FinderBarPanel.swift
      - Sources/FolderPathField.swift
      - Sources/FolderCompletion.swift
      - Sources/NewFileDestination.swift
      - Sources/FolderPath.swift
      - Sources/OnboardingProgress.swift
      - Sources/FinderExtensionStatus.swift
      - FinderExtension/MenuRequestStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.durklas0x.Robin.Tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Robin:
    build:
      targets:
        Robin: all
        RobinTests: [test]
    test:
      targets:
        - RobinTests
