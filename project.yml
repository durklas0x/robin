name: Pathlet
options:
  bundleIdPrefix: com.martynasgz
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Pathlet:
    type: application
    platform: macOS
    sources:
      - Sources
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.martynasgz.Pathlet
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Pathlet reads your current Finder folder and opens Terminal there."
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: PathletFinder
        embed: true
    info:
      path: Config/Pathlet-Info.plist
      properties:
        LSUIElement: true
        NSAppleEventsUsageDescription: "Pathlet reads Finder window locations and opens Terminal in your folder."
        CFBundleURLTypes:
          - CFBundleURLName: com.martynasgz.Pathlet.actions
            CFBundleURLSchemes: [pathlet]
    entitlements:
      path: Sources/Pathlet.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true

  PathletFinder:
    type: app-extension
    platform: macOS
    sources:
      - FinderExtension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.martynasgz.Pathlet.Finder
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
    info:
      path: Config/Finder-Info.plist
      properties:
        CFBundleDisplayName: Pathlet Finder Actions
        NSExtension:
          NSExtensionAttributes: {}
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FinderSync
    entitlements:
      path: Config/PathletFinder.entitlements
      properties:
        com.apple.security.app-sandbox: true

  PathletTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Shared
      - Sources/BarPlacement.swift
      - Sources/NewFileDestination.swift
      - FinderExtension/MenuRequestStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.martynasgz.Pathlet.Tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Pathlet:
    build:
      targets:
        Pathlet: all
        PathletTests: [test]
    test:
      targets:
        - PathletTests
